# --- Persistência ---
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

# --- Logs (saem no `docker compose logs`) ---
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# --- Autenticação ---
allow_anonymous false
password_file /mosquitto/config/passwd

# --- Listener MQTT (sem TLS) ---
listener 1883
protocol mqtt