services:
  database:
    image: postgres
    container_name: database
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=SistemaPresencaDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_sistema_presenca:/var/lib/postgresql/data/

  broker:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883" # MQTT sem TLS
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data # persistência (retained messages, sessões, subscriptions)
 
volumes:
  postgres_sistema_presenca:
  mosquitto_data: