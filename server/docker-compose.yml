services:
  database:
    image: postgres
    container_name: database
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=SistemaPresencaDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_sistema_presenca:/var/lib/postgresql/data/

volumes:
  postgres_sistema_presenca: